<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Expense Tracker</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #e2e8f0;
    --muted: #94a3b8; --border: #334155; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); padding: 1.5rem;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 1.5rem; width: 100%; max-width: 360px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.88rem; }
  form { display: grid; gap: 0.6rem; }
  input, button {
    background: #0f172a; border: 1px solid var(--border); color: var(--text);
    padding: 0.6rem 0.7rem; border-radius: 6px; font-size: 0.95rem;
  }
  button { background: var(--accent); color: #0f172a; border: none; font-weight: 600; cursor: pointer; }
  button:hover { opacity: 0.9; }
  #error { color: var(--bad); font-size: 0.85rem; margin: 0.6rem 0 0; min-height: 1.1em; }
  .toggle { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--muted); }
  .toggle a { color: var(--accent); cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Sign in</h1>
  <p class="sub" id="subtitle">Welcome back — log in to see your expenses.</p>
  <form id="auth-form">
    <input id="email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="password" type="password" placeholder="Password (min 8 characters)" autocomplete="current-password" minlength="8" required>
    <button type="submit" id="submit-btn">Sign in</button>
  </form>
  <p id="error"></p>
  <p class="toggle"><a id="toggle-link">Don't have an account? Sign up</a></p>
</div>
<script>
  const form = document.getElementById('auth-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const errorEl = document.getElementById('error');
  const submitBtn = document.getElementById('submit-btn');
  const toggleLink = document.getElementById('toggle-link');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  let mode = 'login';

  toggleLink.addEventListener('click', () => {
    mode = mode === 'login' ? 'signup' : 'login';
    title.textContent = mode === 'login' ? 'Sign in' : 'Create an account';
    subtitle.textContent = mode === 'login' ? 'Welcome back — log in to see your expenses.' : 'Takes a minute — then you can start logging expenses.';
    submitBtn.textContent = mode === 'login' ? 'Sign in' : 'Sign up';
    toggleLink.textContent = mode === 'login' ? "Don't have an account? Sign up" : 'Already have an account? Sign in';
    errorEl.textContent = '';
  });

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errorEl.textContent = '';
    submitBtn.disabled = true;
    try {
      const res = await fetch(`/api/auth/${mode}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailInput.value, password: passwordInput.value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || 'Something went wrong');
      window.location.href = '/';
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
